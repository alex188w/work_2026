<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: layout(~{::content}, ~{}, ~{index :: sidebar})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Отчёт УДЗ</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div>
        <div th:fragment="content">

            <div class="container py-4">
                <h3>Выгрузка отчётов по установкам</h3>
                <!-- <p>Выберать год и месяц проведения работ для отчёта.</p> -->

                <div class="row g-4">

                    <!-- Отчёт по УДЗ -->
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">Отчёт по УДЗ</h5>
                                <!-- <p class="card-text">
                                    Выгрузка отчета по установкам дренажной защиты.
                                </p> -->

                                <form th:action="@{/reports/udz/export}" method="get">

                                    <input type="hidden" name="type" value="udz">
                                    <div class="report">
                                        <div class="mb-3 w-50">
                                            <label for="udz-year" class="form-label">Год</label>
                                            <select id="udz-year" name="year" class="form-select" required>
                                                <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                                                    th:selected="${y == selectedYear}">
                                                </option>
                                            </select>
                                        </div>

                                        <div class="mb-3 w-50">
                                            <label for="udz-month" class="form-label">Месяц</label>
                                            <select id="udz-month" name="month" class="form-select" required>
                                                <option th:each="entry : ${months}" th:value="${entry.key}"
                                                    th:text="${entry.value}"
                                                    th:selected="${entry.key == selectedMonth}">
                                                </option>
                                            </select>
                                        </div>
                                    </div>



                                    <button type="submit" class="btn btn-primary">
                                        Выгрузить отчёт по УДЗ
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Отчёт по УКЗ -->
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">Отчёт по УКЗ</h5>
                                <!-- <p class="card-text">
                                    Выгрузка отчета по установкам катодной защиты.
                                </p> -->

                                <form th:action="@{/reports/udz/export}" method="get">

                                    <input type="hidden" name="type" value="ukz">
                                    <div class="report">
                                        <div class="mb-3 w-50">
                                            <label for="ukz-year" class="form-label">Год</label>
                                            <select id="ukz-year" name="year" class="form-select" required>
                                                <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                                                    th:selected="${y == selectedYear}">
                                                </option>
                                            </select>
                                        </div>

                                        <div class="mb-3 w-50">
                                            <label for="ukz-month" class="form-label">Месяц</label>
                                            <select id="ukz-month" name="month" class="form-select" required>
                                                <option th:each="entry : ${months}" th:value="${entry.key}"
                                                    th:text="${entry.value}"
                                                    th:selected="${entry.key == selectedMonth}">
                                                </option>
                                            </select>
                                        </div>
                                    </div>



                                    <button type="submit" class="btn btn-success">
                                        Выгрузить отчёт по УКЗ
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>

</html>
