<div th:fragment="journal" class="journal">

    <div class="journal-check">
        <input type="hidden" name="done">

        <label class="form-label">Оперативная
            документация</label>

        <div class="view-journal">
            <div class="submit-save">
                <p class="journal-title">Журнал заданий</p>
                <input type="checkbox" class="done-checkbox">
            </div>

            <div class="submit-save">
                <p class="journal-title">Журнал ключей</p>
                <input type="checkbox" class="done-checkbox">
            </div>

            <div class="submit-save">
                <p class="journal-title">Полевой журнал</p>
                <input type="checkbox" class="done-checkbox">
            </div>

            <div class="submit-save">
                <p class="journal-title">Журнал ремонта</p>
                <input type="checkbox" class="done-checkbox">
            </div>
        </div>
    </div>

</div>
